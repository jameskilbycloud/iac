---
- name: Deploy Traefik with Cloudflare SSL
  hosts: all
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    # Traefik container settings - override via inventory, group_vars, or --extra-vars
    traefik_image: "{{ traefik_docker_image | default('traefik:v3.7.19') }}"
    traefik_container_name: "{{ traefik_name | default('traefik') }}"
    traefik_config_dir: "{{ traefik_config_path | default('/etc/traefik') }}"
    traefik_cert_dir: "{{ traefik_acme_path | default('/etc/traefik/acme') }}"
    traefik_network: "{{ traefik_docker_network | default('traefik') }}"

    # Docker socket proxy: read-only, filtered Docker API for Traefik and other
    # readers (Beszel agent, AutoKuma) so none of them mounts the raw socket.
    # Its network is internal, so only containers that join it can reach the API;
    # host-network containers (Beszel agent) use the loopback port instead.
    socket_proxy_image: "{{ traefik_socket_proxy_image | default('tecnativa/docker-socket-proxy:v0.5.0') }}"
    socket_proxy_name: "{{ traefik_socket_proxy_name | default('docker-socket-proxy') }}"
    socket_proxy_network: "{{ traefik_socket_proxy_network | default('socket-proxy') }}"
    socket_proxy_host_port: "{{ traefik_socket_proxy_host_port | default('127.0.0.1:2375') }}"

    # Ports
    traefik_port_web: "{{ traefik_http_port | default(80) }}"
    traefik_port_websecure: "{{ traefik_https_port | default(443) }}"

    # ACME/DNS settings
    acme_delay_before_check: "{{ acme_dns_delay | default(10) }}"
    dns_resolvers: "{{ acme_dns_resolvers | default(['1.1.1.1:53', '8.8.8.8:53']) }}"

    # Logging
    log_level: "{{ traefik_log_level | default('INFO') }}"
    log_format: "{{ traefik_log_format | default('json') }}"
    log_max_size: "{{ traefik_log_max_size | default('10m') }}"
    log_max_files: "{{ traefik_log_max_files | default('3') }}"

    # Health checks
    healthcheck_interval: "{{ traefik_healthcheck_interval | default('30s') }}"
    healthcheck_timeout: "{{ traefik_healthcheck_timeout | default('10s') }}"
    healthcheck_retries: "{{ traefik_healthcheck_retries | default(3) }}"
    healthcheck_start_period: "{{ traefik_healthcheck_start_period | default('30s') }}"

    # Test service (set deploy_test_service to false to skip)
    deploy_test_service: "{{ traefik_deploy_test_service | default(true) }}"
    test_service_name: "{{ traefik_test_container | default('nginx-test') }}"
    test_service_image: "{{ traefik_test_image | default('nginx:alpine') }}"
    test_service_domain: "{{ traefik_test_domain | default('test.' ~ wildcard_domain) }}"

    # Health check polling settings
    healthcheck_poll_retries: "{{ traefik_healthcheck_poll_retries | default(12) }}"
    healthcheck_poll_delay: "{{ traefik_healthcheck_poll_delay | default(5) }}"

    # Dashboard settings (dashboard_domain auto-generated in pre_tasks if traefik_dashboard_domain not set)
    dashboard_admin_user: "{{ traefik_dashboard_user | default('admin') }}"

    # Authelia forwardAuth endpoint, published as the authelia@file middleware that
    # stacks reference in their labels. Leave empty to skip the middleware.
    # e.g. http://authelia:9091/api/authz/forward-auth when Authelia runs on this
    # host, or http://192.168.4.101:9091/api/authz/forward-auth from another host.
    authelia_forward_auth_address: "{{ traefik_authelia_address | default('') }}"
    # Cap on the forwardAuth response body Traefik will buffer (bytes). Authelia's
    # replies are a few KB; the limit guards against memory exhaustion.
    authelia_max_response_body: "{{ traefik_authelia_max_response_body | default(1048576) }}"

    # Middleware on the dashboard router: dashboard-auth (basic auth) or authelia@file.
    dashboard_middleware: "{{ traefik_dashboard_middleware | default('dashboard-auth') }}"

    # Request headers whose name aliases a managed one (X_Auth_User for X-Auth-User):
    # keep | delete | reject. delete stops clients spoofing Authelia's Remote-* headers
    # to backends that read them as CGI-style variables (Django, PHP).
    alias_headers_strategy: "{{ traefik_alias_headers_strategy | default('delete') }}"

    # Host-specific routers and services merged into dynamic.yml, as mappings in
    # Traefik's own shape, e.g. traefik_extra_routers: {name: {rule: ..., service: ...}}.
    extra_routers: "{{ traefik_extra_routers | default({}) }}"
    extra_services: "{{ traefik_extra_services | default({}) }}"

    # Required variables (no defaults - must be provided):
    # - cloudflare_api_token: Cloudflare API token for DNS challenge
    # - wildcard_domain: Base domain for wildcard certificates
    # - dashboard_admin_password_hash: htpasswd hash for dashboard auth

    # Static configuration template
    traefik_static_config: |
      # Entry points configuration
      entryPoints:
        web:
          address: ":{{ traefik_port_web }}"
          http:
            redirections:
              entrypoint:
                to: websecure
                scheme: https
                permanent: true
            aliasHeadersStrategy: {{ alias_headers_strategy }}
        websecure:
          address: ":{{ traefik_port_websecure }}"
          http:
            aliasHeadersStrategy: {{ alias_headers_strategy }}
            encodedCharacters:
              # No backend needs a NUL byte in a path; denying it also tells
              # Traefik the encoded-character options have been reviewed.
              allowEncodedNullCharacter: false
          transport:
            respondingTimeouts:
              # readTimeout covers reading the whole request including the body,
              # and defaults to 60s in v3 - far too short for multi-gigabyte
              # uploads such as the VCF offline bundle server. Set to 0 to
              # disable the limit entirely.
              readTimeout: "{{ traefik_read_timeout | default('3600s') }}"
              idleTimeout: "{{ traefik_idle_timeout | default('180s') }}"

        # Internal entry point for ping (health check) and the API; Traefik
        # creates it on :8080 by default. Declared only to set the header strategy.
        traefik:
          address: ":8080"
          http:
            aliasHeadersStrategy: {{ alias_headers_strategy }}

      # Provider configuration
      providers:
        docker:
          endpoint: "tcp://{{ socket_proxy_name }}:2375"
          exposedByDefault: false
          network: "{{ traefik_network }}"
          watch: true
        file:
          filename: /etc/traefik/dynamic.yml
          watch: true

      # Certificate resolvers
      certificatesResolvers:
        cloudflare:
          acme:
            storage: "/acme/acme.json"
            dnsChallenge:
              provider: cloudflare
              propagation:
                delayBeforeChecks: {{ acme_delay_before_check }}
              resolvers:
                {% for resolver in dns_resolvers %}
                - "{{ resolver }}"
                {% endfor %}

      # API configuration
      api:
        dashboard: true
        insecure: false

      # Health check endpoint
      ping: {}

      # Global configuration
      global:
        checkNewVersion: false
        sendAnonymousUsage: false

      # Logging
      log:
        level: {{ log_level }}
        format: {{ log_format }}
      accessLog:
        format: {{ log_format }}

    traefik_dynamic_config: |
      # Dynamic configuration for Traefik dashboard
      http:
        middlewares:
          dashboard-auth:
            basicAuth:
              users:
                - "{{ dashboard_admin_user }}:{{ dashboard_admin_password_hash }}"
      {% if authelia_forward_auth_address | length > 0 %}
          authelia:
            forwardAuth:
              address: "{{ authelia_forward_auth_address }}"
              trustForwardHeader: true
              maxResponseBodySize: {{ authelia_max_response_body }}
              authResponseHeaders:
                - "Remote-User"
                - "Remote-Groups"
                - "Remote-Name"
                - "Remote-Email"
      {% endif %}
        routers:
          traefik-dashboard:
            rule: "Host(`{{ dashboard_domain }}`)"
            entryPoints:
              - websecure
            service: api@internal
            tls:
              certResolver: cloudflare
            middlewares:
              - {{ dashboard_middleware }}
      {% for name, router in extra_routers.items() %}
          {{ name }}:
            {{ router | to_nice_yaml(indent=2) | indent(6) | trim }}
      {% endfor %}

          # Wildcard certificate request router
          wildcard-cert:
            rule: "Host(`{{ wildcard_domain }}`)"
            entryPoints:
              - websecure
            service: noop@internal
            tls:
              certResolver: cloudflare
              domains:
                - main: {{ wildcard_domain }}
                  sans:
                    - "*.{{ wildcard_domain }}"
      {% if extra_services | length > 0 %}
        services:
      {% for name, svc in extra_services.items() %}
          {{ name }}:
            {{ svc | to_nice_yaml(indent=2) | indent(6) | trim }}
      {% endfor %}
      {% endif %}

  pre_tasks:
    - name: Check if running on supported OS
      ansible.builtin.fail:
        msg: "This playbook only supports Ubuntu/Debian"
      when: ansible_facts['os_family'] not in ['Debian']

    # vars.yml is gitignored, so runs from Semaphore must get these from the
    # template's environment; fail here rather than halfway through the config.
    - name: Check required variables are set
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item, default='') | string | length > 0
          - lookup('ansible.builtin.vars', item, default='') != 'REPLACE_WITH_YOUR_TOKEN'
        fail_msg: "Required variable '{{ item }}' is not set (see 'Required variables' at the top of this playbook)"
        quiet: true
      loop:
        - cloudflare_api_token
        - wildcard_domain
        - dashboard_admin_password_hash

    - name: Set dashboard domain
      ansible.builtin.set_fact:
        dashboard_domain: "{{ traefik_dashboard_domain | default(ansible_facts['hostname'] ~ '-dash.' ~ wildcard_domain) }}"
      when: wildcard_domain is defined


    # Facts are gathered with become, so user_id is root; SUDO_USER is the login user.
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
        groups: docker
        append: true

    - name: Verify Docker is working
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "Docker version: {{ docker_version.stdout }}"

  tasks:
    - name: Create Traefik directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
        owner: root
        group: root
      loop:
        - { path: "{{ traefik_config_dir }}", mode: "0755" }
        - { path: "{{ traefik_cert_dir }}", mode: "0700" }

    - name: Initialize ACME certificate storage
      ansible.builtin.file:
        path: "{{ traefik_cert_dir }}/acme.json"
        state: touch
        mode: '0600'
        owner: root
        group: root
        modification_time: preserve
        access_time: preserve

    - name: Create Docker network for Traefik
      community.docker.docker_network:
        name: "{{ traefik_network }}"
        state: present
      register: network_result

    - name: Display network creation result
      ansible.builtin.debug:
        msg: "Traefik network created: {{ network_result.network.Name }}"

    - name: Create internal Docker network for the socket proxy
      community.docker.docker_network:
        name: "{{ socket_proxy_network }}"
        internal: true
        state: present

    - name: Deploy Docker socket proxy
      community.docker.docker_container:
        name: "{{ socket_proxy_name }}"
        image: "{{ socket_proxy_image }}"
        restart_policy: unless-stopped
        state: started
        env:
          # GET-only API sections. POST=0 blocks every write (create, exec, stop).
          # CONTAINERS: list/inspect/stats; NETWORKS: Traefik's container IPs;
          # INFO and IMAGES: Beszel host and container details. EVENTS, PING and
          # VERSION are on by default.
          CONTAINERS: "1"
          NETWORKS: "1"
          INFO: "1"
          IMAGES: "1"
          EVENTS: "1"
          PING: "1"
          VERSION: "1"
          POST: "0"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
        # Loopback only. An internal network can't publish ports, so the default
        # bridge carries this one.
        ports:
          - "{{ socket_proxy_host_port }}:2375"
        networks:
          - name: bridge
          - name: "{{ socket_proxy_network }}"
        log_driver: json-file
        log_options:
          max-size: "{{ log_max_size }}"
          max-file: "{{ log_max_files }}"

    - name: Write Traefik static configuration
      ansible.builtin.copy:
        content: "{{ traefik_static_config }}"
        dest: "{{ traefik_config_dir }}/traefik.yml"
        mode: '0644'
        owner: root
        group: root
      register: static_config_result
      notify: Restart Traefik container

    - name: Write Traefik dynamic configuration
      ansible.builtin.copy:
        content: "{{ traefik_dynamic_config }}"
        dest: "{{ traefik_config_dir }}/dynamic.yml"
        mode: '0644'
        owner: root
        group: root
      register: dynamic_config_result
      notify: Restart Traefik container

    - name: Deploy Traefik container
      block:
        - name: Pull Traefik Docker image
          community.docker.docker_image:
            name: "{{ traefik_image }}"
            source: pull
            force_source: false
          register: image_pull_result

        - name: Stop existing Traefik container if running
          community.docker.docker_container:
            name: "{{ traefik_container_name }}"
            state: absent

        - name: Start Traefik container
          community.docker.docker_container:
            name: "{{ traefik_container_name }}"
            image: "{{ traefik_image }}"
            restart_policy: unless-stopped
            state: started
            ports:
              - "{{ traefik_port_web }}:80"
              - "{{ traefik_port_websecure }}:443"
            env:
              CF_DNS_API_TOKEN: "{{ cloudflare_api_token }}"
            volumes:
              - "{{ traefik_config_dir }}/traefik.yml:/etc/traefik/traefik.yml:ro"
              - "{{ traefik_config_dir }}/dynamic.yml:/etc/traefik/dynamic.yml:ro"
              - "{{ traefik_cert_dir }}:/acme"
            labels:
              traefik.enable: "true"
              traefik.http.routers.traefik.rule: "Host(`{{ dashboard_domain }}`)"
              traefik.http.routers.traefik.service: "api@internal"
              traefik.http.routers.traefik.entrypoints: "websecure"
              traefik.http.routers.traefik.middlewares: "dashboard-auth@file"
            networks:
              - name: "{{ traefik_network }}"
              - name: "{{ socket_proxy_network }}"
            log_driver: json-file
            log_options:
              max-size: "{{ log_max_size }}"
              max-file: "{{ log_max_files }}"
            healthcheck:
              test: ["CMD", "traefik", "healthcheck", "--ping"]
              interval: "{{ healthcheck_interval }}"
              timeout: "{{ healthcheck_timeout }}"
              retries: "{{ healthcheck_retries }}"
              start_period: "{{ healthcheck_start_period }}"
          register: container_result

        - name: Wait for Traefik container to become healthy
          community.docker.docker_container_info:
            name: "{{ traefik_container_name }}"
          register: container_info
          until: >
            container_info.container.State.Status == "running" and
            (container_info.container.State.Health.Status | default('starting')) == "healthy"
          retries: "{{ healthcheck_poll_retries }}"
          delay: "{{ healthcheck_poll_delay }}"

        - name: Fail if Traefik container is not healthy
          ansible.builtin.fail:
            msg: "Traefik container failed to become healthy. Status: {{ container_info.container.State.Health.Status | default('unknown') }}"
          when: (container_info.container.State.Health.Status | default('unhealthy')) != "healthy"

      rescue:
        - name: Get Traefik container logs on failure
          ansible.builtin.command:
            cmd: docker logs --tail 100 {{ traefik_container_name }}
          register: failure_logs
          failed_when: false
          changed_when: false

        - name: Display failure logs
          ansible.builtin.debug:
            msg: |
              Traefik deployment failed. Container logs:
              {{ failure_logs.stdout | default('No logs available') }}

        - name: Cleanup failed container
          community.docker.docker_container:
            name: "{{ traefik_container_name }}"
            state: absent
          failed_when: false

        - name: Fail with deployment error
          ansible.builtin.fail:
            msg: "Traefik deployment failed. Check logs above for details."

    - name: Display Traefik container status
      ansible.builtin.debug:
        msg: |
          Traefik Status: {{ container_info.container.State.Status }}
          Health: {{ container_info.container.State.Health.Status | default('N/A') }}
          Started: {{ container_info.container.State.StartedAt }}

    - name: Deploy test nginx service
      community.docker.docker_container:
        name: "{{ test_service_name }}"
        image: "{{ test_service_image }}"
        restart_policy: unless-stopped
        state: started
        networks:
          - name: "{{ traefik_network }}"
        labels:
          traefik.enable: "true"
          traefik.http.routers.nginx-test.rule: "Host(`{{ test_service_domain }}`)"
          traefik.http.routers.nginx-test.entrypoints: "websecure"
          traefik.http.routers.nginx-test.tls: "true"
          traefik.http.services.nginx-test.loadbalancer.server.port: "80"
      when: deploy_test_service | bool

    - name: Skip test service deployment
      ansible.builtin.debug:
        msg: "Test service deployment skipped (deploy_test_service={{ deploy_test_service }})"
      when: not (deploy_test_service | bool)

    - name: Get recent Traefik logs
      ansible.builtin.command:
        cmd: docker logs --tail 50 {{ traefik_container_name }}
      register: traefik_logs
      changed_when: false

    - name: Display ACME and certificate related logs
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ traefik_logs.stdout_lines | select('search', 'acme|certificate|error|WARN|ERROR') | list }}"
      when: traefik_logs.stdout_lines | select('search', 'acme|certificate|error|WARN|ERROR') | list | length > 0



  post_tasks:
    - name: Deployment summary
      ansible.builtin.debug:
        msg: |
          ==========================================
          Traefik Deployment Summary
          ==========================================
          Container Status: {{ container_info.container.State.Status }}
          Health Status: {{ container_info.container.State.Health.Status | default('N/A') }}
          Dashboard URL: https://{{ dashboard_domain }}
          {% if deploy_test_service | bool %}
          Test Service URL: https://{{ test_service_domain }}
          {% else %}
          Test Service: Not deployed (disabled)
          {% endif %}

          Next Steps:
          1. Ensure DNS records point to this server:
             - {{ dashboard_domain }} -> {{ ansible_facts['default_ipv4']['address'] }}
          {% if deploy_test_service | bool %}
             - {{ test_service_domain }} -> {{ ansible_facts['default_ipv4']['address'] }}
          {% endif %}

          2. Wait 1-2 minutes for SSL certificates to be issued

          Troubleshooting:
          - Check logs: docker logs {{ traefik_container_name }}
          - Verify network: docker network inspect {{ traefik_network }}
          - Test locally: curl -H "Host: {{ dashboard_domain }}"
          ==========================================

  handlers:
    - name: Restart Traefik container
      community.docker.docker_container:
        name: "{{ traefik_container_name }}"
        state: started
        restart: true
