---
# Create SMB shares that don't already exist (matched by share name).
- name: Fetch existing SMB shares
  ansible.builtin.uri:
    url: "{{ truenas_api_url }}/sharing/smb?limit=0"
    method: GET
    headers: "{{ truenas_headers }}"
    validate_certs: "{{ truenas_validate_certs }}"
  register: tn_existing_smb
  no_log: true

- name: Create missing SMB shares
  ansible.builtin.uri:
    url: "{{ truenas_api_url }}/sharing/smb"
    method: POST
    headers: "{{ truenas_headers }}"
    body_format: json
    body:
      path: "/mnt/{{ truenas_pool }}/{{ item.dataset }}"
      name: "{{ item.name }}"
      comment: "{{ item.comment | default('') }}"
      purpose: "{{ item.purpose | default('DEFAULT_SHARE') }}"
      ro: "{{ item.readonly | default(false) }}"
      enabled: "{{ item.enabled | default(true) }}"
    status_code: [200, 201]
    validate_certs: "{{ truenas_validate_certs }}"
  loop: "{{ truenas_smb_shares }}"
  loop_control:
    label: "{{ item.name }} -> /mnt/{{ truenas_pool }}/{{ item.dataset }}"
  when: item.name not in (tn_existing_smb.json | map(attribute='name') | list)
