---
- name: Install NVIDIA vGPU drivers and license file
  hosts: all
  become: yes

  vars:
    ansible_python_interpreter: /usr/bin/python3
    # NVIDIA driver configuration - override via inventory, group_vars, or --extra-vars
    nvidia_driver_file: "{{ nvidia_vgpu_driver_file | default('NVIDIA-Linux-x86_64-595.71.05-grid.run') }}"
    nvidia_licence_file: "{{ nvidia_vgpu_licence_file | default('client_configuration_token_09-14-2026-15-15-53.tok') }}"
    nvidia_driver_path: "{{ nvidia_vgpu_driver_path | default('/tmp/' ~ nvidia_driver_file) }}"

    # NFS share configuration - override via inventory, group_vars, or --extra-vars
    nfs_server: "{{ nvidia_nfs_server | default('nas.jameskilby.cloud') }}"
    nfs_export_path: "{{ nvidia_nfs_export_path | default('/mnt/pool1/ISO/nvidia') }}"
    nfs_mount_point: "{{ nvidia_nfs_mount_point | default('/mnt/iso/nvidia') }}"

  pre_tasks:
    - name: Install build tools and headers
      ansible.builtin.apt:
        name:
          - build-essential
          - dkms
          - "linux-headers-{{ ansible_kernel }}"
          - gcc
          - curl
          - ca-certificates
          - make
          - gnupg
          - software-properties-common
        state: present
        update_cache: yes
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure NFS mount point exists
      ansible.builtin.file:
        path: "{{ nfs_mount_point }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: yes

    - name: Mount NFS share containing NVIDIA drivers
      ansible.builtin.mount:
        src: "{{ nfs_server }}:{{ nfs_export_path }}"
        path: "{{ nfs_mount_point }}"
        fstype: nfs
        opts: rsize=1048576,wsize=1048576,timeo=900,retrans=3
        state: mounted

  tasks:
    - name: Abort if NFS variables are missing
      ansible.builtin.assert:
        that:
          - nfs_server | length > 0
          - nfs_export_path | length > 0
          - nfs_mount_point | length > 0

    - name: Derive target driver version from installer filename
      ansible.builtin.set_fact:
        nvidia_target_version: "{{ nvidia_driver_file | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"

    - name: Check installed NVIDIA driver version
      ansible.builtin.command: modinfo -F version nvidia
      register: nvidia_version_check
      changed_when: false
      failed_when: false

    - name: Set installed driver version fact
      ansible.builtin.set_fact:
        nvidia_installed_version: "{{ nvidia_version_check.stdout | trim if nvidia_version_check.rc == 0 else '' }}"

    - name: Report driver status
      ansible.builtin.debug:
        msg: >-
          {% if nvidia_installed_version == nvidia_target_version %}
          NVIDIA driver {{ nvidia_target_version }} is already installed. Skipping installation.
          {% elif nvidia_installed_version | length > 0 %}
          NVIDIA driver {{ nvidia_installed_version }} is installed but target is {{ nvidia_target_version }}. Upgrading.
          {% else %}
          No NVIDIA driver installed. Installing {{ nvidia_target_version }}.
          {% endif %}

    - name: Install NVIDIA vGPU driver
      block:
        - name: Copy NVIDIA vGPU driver installer
          ansible.builtin.copy:
            src: "{{ nfs_mount_point }}/{{ nvidia_driver_file }}"
            dest: "{{ nvidia_driver_path }}"
            mode: '0755'
            remote_src: true

        - name: Stop NVIDIA services before upgrade
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - nvidia-gridd
            - nvidia-persistenced
          failed_when: false
          when: nvidia_installed_version | length > 0

        - name: Kill processes holding the GPU
          ansible.builtin.shell: fuser -k /dev/nvidia* 2>/dev/null || true
          when: nvidia_installed_version | length > 0

        - name: Unload NVIDIA kernel modules before upgrade
          ansible.builtin.shell: modprobe -r nvidia_drm nvidia_modeset nvidia_uvm nvidia
          register: nvidia_unload
          failed_when: false
          when: nvidia_installed_version | length > 0

        - name: Reboot to release NVIDIA modules
          ansible.builtin.reboot:
            reboot_timeout: 600
            msg: "Rebooting to release in-use NVIDIA kernel modules before upgrade"
          when: nvidia_installed_version | length > 0 and nvidia_unload.rc != 0

        - name: Unload NVIDIA kernel modules after reboot
          ansible.builtin.shell: |
            systemctl stop nvidia-gridd nvidia-persistenced 2>/dev/null || true
            fuser -k /dev/nvidia* 2>/dev/null || true
            modprobe -r nvidia_drm nvidia_modeset nvidia_uvm nvidia 2>/dev/null || true
          when: nvidia_installed_version | length > 0 and nvidia_unload.rc != 0

        - name: Verify NVIDIA modules are unloaded
          ansible.builtin.shell: "! lsmod | grep -q '^nvidia '"
          changed_when: false
          when: nvidia_installed_version | length > 0

        - name: Run NVIDIA vGPU driver installer
          ansible.builtin.shell: "{{ nvidia_driver_path }} --silent --no-cc-version-check --dkms"
          register: nvidia_installer

        - name: Reboot after driver upgrade
          ansible.builtin.reboot:
            reboot_timeout: 600
            msg: "Rebooting to complete NVIDIA driver upgrade to {{ nvidia_target_version }}"
          when: nvidia_installed_version | length > 0

        # The reboot may boot a newer staged kernel than the one the DKMS
        # build ran against - rebuild for the running kernel if needed
        - name: Ensure DKMS module is built for the running kernel
          ansible.builtin.shell: |
            set -e
            KVER=$(uname -r)
            if ! modinfo -F version nvidia >/dev/null 2>&1; then
              apt-get install -y "linux-headers-${KVER}"
              dkms autoinstall -k "${KVER}"
            fi
            modprobe nvidia
          environment:
            DEBIAN_FRONTEND: noninteractive
          when: nvidia_installed_version | length > 0

        - name: Verify installed driver matches target version
          ansible.builtin.command: modinfo -F version nvidia
          register: nvidia_post_install_version
          changed_when: false
          failed_when: nvidia_post_install_version.stdout | trim != nvidia_target_version

      rescue:
        - name: Fetch nvidia-installer log tail
          ansible.builtin.shell: tail -30 /var/log/nvidia-installer.log
          register: installer_log
          failed_when: false
          changed_when: false

        - name: Display driver installation failure
          ansible.builtin.debug:
            msg: |
              NVIDIA driver installation failed.

              Installer log:
              {{ installer_log.stdout | default('Unable to read /var/log/nvidia-installer.log') }}

              Verify:
              - Driver file exists at {{ nfs_mount_point }}/{{ nvidia_driver_file }}
              - Kernel headers are installed for {{ ansible_kernel }}
              - No conflicting NVIDIA drivers are installed

        - name: Fail with driver installation error
          ansible.builtin.fail:
            msg: "NVIDIA vGPU driver installation failed. Check output above."
      when: nvidia_installed_version != nvidia_target_version

    - name: Configure NVIDIA licensing
      block:
        - name: Ensure NVIDIA ClientConfigToken directory exists
          ansible.builtin.file:
            path: /etc/nvidia/ClientConfigToken
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Copy NVIDIA licence token
          ansible.builtin.copy:
            src: "{{ nfs_mount_point }}/{{ nvidia_licence_file }}"
            dest: /etc/nvidia/ClientConfigToken/
            mode: '0744'
            remote_src: true

        - name: Restart NVIDIA vGPU client software (nvidia-gridd)
          ansible.builtin.systemd:
            name: nvidia-gridd
            state: restarted
            enabled: true

        - name: Wait for nvidia-gridd to be active
          ansible.builtin.systemd:
            name: nvidia-gridd
          register: gridd_status
          retries: 5
          delay: 2
          until: gridd_status.status.ActiveState == "active"

        - name: Confirm gridd service is active
          ansible.builtin.debug:
            msg: "nvidia-gridd is running."

        - name: Wait for license to be applied
          ansible.builtin.pause:
            seconds: 30

        - name: Check vGPU license status
          ansible.builtin.shell: |
            /usr/bin/nvidia-smi -q
          environment:
            PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          register: vgpu_info
          changed_when: false
          failed_when: "'Unlicensed' in vgpu_info.stdout"

      rescue:
        - name: Get nvidia-gridd service status
          ansible.builtin.command: systemctl status nvidia-gridd
          register: gridd_service_status
          failed_when: false
          changed_when: false

        - name: Get nvidia-gridd logs
          ansible.builtin.command: journalctl -u nvidia-gridd --no-pager -n 30
          register: gridd_logs
          failed_when: false
          changed_when: false

        - name: Display licensing failure details
          ansible.builtin.debug:
            msg: |
              NVIDIA vGPU licensing failed.

              Service status:
              {{ gridd_service_status.stdout | default('Unable to get status') }}

              Journal logs:
              {{ gridd_logs.stdout | default('Unable to get logs') }}

              Verify:
              - License token file exists at {{ nfs_mount_point }}/{{ nvidia_licence_file }}
              - License server is reachable
              - Token is valid and not expired

        - name: Fail with licensing error
          ansible.builtin.fail:
            msg: "NVIDIA vGPU licensing failed. Check output above."

    - name: Show vGPU license info
      ansible.builtin.debug:
        msg: "{{ vgpu_info.stdout | trim }}"
      when: vgpu_info is defined