---
# VCF provisioning configuration for mikrotik-sw-1 (192.168.3.1)

system_identity: "vcf-switch-01"

# NTP — this switch IS ntp-1.jameskilby.cloud, the lab's NTP server, so it
# can't sync from itself: it syncs from Cloudflare upstream and serves NTP
# to everything else in the lab.
ntp_server: "time.cloudflare.com"
enable_ntp_server: true

# Management
management_interface: "ether1"
management_ip: "192.168.3.1/24"
management_gateway: "192.168.3.248"

# Interface groups — referenced by name in vlan tagged_groups
interface_groups:
  uplink: []   # qsfp28-4-1 (UniFi gateway LAN trunk) disabled 2026-07-01 — see disabled_interfaces
  interswitch:
    - qsfp28-1-1   # UniFi gateway + trunk to mikrotik-sw-2 (CRS305) / downstream
                   # MikroTik fabric. NOTE: the UniFi is reached via THIS port,
                   # not qsfp28-4-1 — so any VLAN that must reach the gateway
                   # (e.g. VLAN 60, whose DHCP server lives on the UniFi) has to
                   # tag `interswitch`, not just `uplink`.
  hosts:
    - qsfp28-1-2
    - qsfp28-1-3
    - qsfp28-2-1   # uk-bhr-p-ntnx-2 (2nd link) — cabled 2026-07-01
    - qsfp28-2-2   # uk-bhr-p-ntnx-1 — was mislabelled "Z840-1"
    - qsfp28-2-3   # uk-bhr-p-ntnx-2 — was mislabelled "Z840-2"
    - qsfp28-3-1
    - qsfp28-3-2
    - qsfp28-3-3
    - qsfp28-3-4
  storage:
    - qsfp28-1-4
    - qsfp28-2-4

# All interfaces to add to the bridge (union of all groups)
# Interface speed overrides (for DAC/breakout cables)
# (qsfp28-4-1/4-2 overrides removed 2026-07-01 — ports disabled, see disabled_interfaces)
interface_speed_overrides: []

uplink_interfaces: []   # qsfp28-4-1 disabled 2026-07-01 — see disabled_interfaces

trunk_interfaces:
  - qsfp28-1-1   # Trunk to mikrotik-sw-2 + downstream fabric (was disabled pre-cutover)
  - qsfp28-1-2
  - qsfp28-1-3
  - qsfp28-1-4
  - qsfp28-2-1   # uk-bhr-p-ntnx-2 (2nd link) — cabled 2026-07-01
  - qsfp28-2-2
  - qsfp28-2-3
  - qsfp28-2-4
  - qsfp28-3-1
  - qsfp28-3-2
  - qsfp28-3-3
  - qsfp28-3-4

# Access (untagged) ports grouped by VLAN — pure L2 transit, no switch IP.
# WAN-Transit (qsfp28-4-2/4-3) removed 2026-07-01 alongside the UniFi uplink
# — see disabled_interfaces below.
access_vlans: []

# Ports to disable (unused — not in any group)
disabled_interfaces:
  - qsfp28-4-1   # UniFi gateway LAN trunk — disabled 2026-07-01
  - qsfp28-4-2   # UniFi WAN — disabled 2026-07-01
  - qsfp28-4-3   # ISP handoff — disabled 2026-07-01
  - qsfp28-4-4

# VLAN definitions
# tagged_groups references keys from interface_groups above
vlans:
  - id: 100
    name: Management
    network: "192.168.100.0/24"
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 101
    name: vMotion
    network: "192.168.101.0/24"
    mtu: 9212
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 102
    name: vSAN
    network: "192.168.102.0/24"
    mtu: 9212
    tagged_groups:
      - uplink
      - hosts

  - id: 103
    name: NSX-TEP
    network: "192.168.103.0/24"
    mtu: 9212
    tagged_groups:
      - uplink
      - hosts

  - id: 104
    name: NSX-Edge-TEP
    network: "192.168.104.0/24"
    mtu: 9212
    tagged_groups:
      - uplink
      - hosts

  - id: 105
    name: VM-Network
    network: "192.168.105.0/24"
    tagged_groups:
      - uplink
      - hosts
    dhcp:
      pool_name: dhcp-vm-pool
      server_name: dhcp-vm
      range_start: "192.168.105.100"
      range_end: "192.168.105.200"
      lease_time: "1d"

  - id: 106
    name: NSX-Edge-Uplink-1
    network: "192.168.106.0/24"
    tagged_groups:
      - uplink
      - hosts

  - id: 107
    name: NSX-Edge-Uplink-2
    network: "192.168.107.0/24"
    tagged_groups:
      - uplink
      - hosts

  - id: 2
    name: DMZ
    network: "192.168.2.0/24"
    tagged_groups:
      - uplink
      - hosts
      - interswitch
    dhcp:
      pool_name: dhcp-dmz-pool
      server_name: dhcp-dmz
      range_start: "192.168.2.100"
      range_end: "192.168.2.200"
      lease_time: "1h"

  - id: 60
    name: NFS-Storage
    mtu: 9212
    tagged_groups:
      - uplink
      - hosts
      - storage
      - interswitch

  # ---------------------------------------------------------------------
  # Legacy pre-cutover VMware VLANs — kept alongside the renumbered
  # 100-series so existing ESXi hosts keep working on their original IDs.
  # All pure L2 (no SVI/DHCP on the switch); routing handled upstream.
  # Tagged to the VMware host ports + UniFi uplink, matching the pre-cutover
  # tagging captured in configs/*_latest.rsc. (The old "workstations" group —
  # qsfp28-2-2/2-3, mislabelled "Z840-1"/"Z840-2" — was stale: those ports are
  # uk-bhr-p-ntnx-1/2 and now live in the `hosts` group.)
  # ---------------------------------------------------------------------
  - id: 38
    name: VMware-Management   # was "VMwareMGMT" (now also on VLAN 100)
    mtu: 9216
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 39
    name: vMotion-Legacy      # was "vMotion" (now also on VLAN 101)
    mtu: 9216
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 40
    name: vSAN-Legacy         # was "vSAN" (now also on VLAN 102)
    mtu: 9216
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 3
    name: NetMan-Legacy       # was "NetMan"
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 4
    name: ServerVLAN-Legacy   # was "ServerVLAN"
    tagged_groups:
      - uplink
      - hosts
      - interswitch

  - id: 61
    name: iscsi2-Legacy       # was "iscsi2"; also reaches storage targets
    mtu: 9216
    tagged_groups:
      - uplink
      - hosts
      - storage
      - interswitch

# Holodeck (nested VCF) transit VLANs — https://github.com/vmware/Holodeck
# Holodeck 9.1: multi-host nested deployments need the Holodeck VLAN ranges
# carried (tagged) on the physical trunk between ESXi hosts. The defaults
# (Site A 10-25, Site B 40-58) collide with this fabric, so we relocate via a
# custom VLANRangeStart. site_a_start / site_b_start map 1:1 to Holodeck's
# VLANRangeStart = [site_a, site_b]. Site A needs 16 consecutive VLANs (always);
# Site B needs 19 (dual-site / NSX Federation / DR only — set dual_site=false
# for a single-site deployment to skip it). Pure L2: the Holo-Router does all
# routing, so no SVI/DHCP/BGP on the switch. VLAN 0 (untagged) is already
# carried as the native VLAN on the trunk ports. Keep the two blocks
# non-overlapping with each other and with the VLANs above.
holodeck:
  enabled: true
  dual_site: true           # Site A + Site B (multisite). false = Site A only.
  site_a_start: 300         # Site A: 16 consecutive -> VLANs 300-315
  site_b_start: 330         # Site B: 19 consecutive -> VLANs 330-348 (dual-site only)
  mtu: 9216
  tagged_groups:
    - hosts
    - interswitch

# BGP
bgp_router_id: "192.168.3.1"
bgp_local_address: "192.168.3.1"
bgp_peer_address: "192.168.3.248"
bgp_peer_name: "unifi"

bgp_advertise_networks:
  - "192.168.2.0/24"
  - "192.168.100.0/24"
  - "192.168.101.0/24"
  - "192.168.102.0/24"
  - "192.168.103.0/24"
  - "192.168.104.0/24"
  - "192.168.105.0/24"
