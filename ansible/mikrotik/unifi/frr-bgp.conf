! UniFi Dream Machine Beast — BGP config (Settings → Routing → BGP → upload)
!
! iBGP AS 65000 with mikrotik-sw-1 (vcf-switch-01). The UniFi only LEARNS the
! VCF networks; it advertises nothing (sw-1 has a static default route and its
! bgp-in filter accepts nothing but 0.0.0.0/0 anyway).
!
! Peers over the VLAN 15 transit (192.168.15.0/24, 10G, hardware-routed on
! sw-1). sw-1's management stays on 192.168.3.1 (ether1) and is not a BGP
! peer — moved 2026-10-15.
!
! No inbound filter: sw-1's bgp-vcf-out chain already limits what it sends to
! the VCF networks. (An earlier version filtered with an `ip prefix-list`, but
! the UniFi uploader silently drops prefix-list lines, so the route-map
! matched nothing and every route was rejected — PfxRcd 0, VCF unreachable.)
!
route-map DENY-ALL deny 10
!
router bgp 65000
 bgp router-id 192.168.3.248
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 ! sw-1 on the VLAN 15 transit
 neighbor 192.168.15.1 remote-as 65000
 neighbor 192.168.15.1 description vcf-switch-01-transit
 neighbor 192.168.15.1 update-source 192.168.15.248
 !
 address-family ipv4 unicast
  neighbor 192.168.15.1 activate
  neighbor 192.168.15.1 soft-reconfiguration inbound
  neighbor 192.168.15.1 route-map DENY-ALL out
 exit-address-family
!
