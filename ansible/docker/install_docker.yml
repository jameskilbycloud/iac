---
- name: Install Docker on supported Ubuntu hosts
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    docker_gpg_url: https://download.docker.com/linux/ubuntu/gpg
    docker_gpg_armored_path: /etc/apt/keyrings/docker.asc
    allow_reboot: false
    # Daemon-wide defaults merged into /etc/docker/daemon.json. Keys already in
    # the file that are not listed here (e.g. the "nvidia" runtime written by
    # nvidia-ctk in ../vGPU) are preserved; keys listed here win.
    #  - log-opts: every container gets capped json-file logs, including ones
    #    started outside compose (docker run, Portainer agent, DockFlare's
    #    cloudflared) that never set their own logging block. Only applies to
    #    containers created after the change.
    #  - live-restore: containers keep running while dockerd restarts or is
    #    upgraded. Enabling it needs one daemon restart, which does restart them.
    docker_daemon_options:
      log-driver: json-file
      log-opts:
        max-size: "10m"
        max-file: "3"
      live-restore: true
    # Kernel settings for a busy container host, written to
    # /etc/sysctl.d/90-homelab-docker.conf (tag: host-tuning).
    #  - vm.swappiness 10: with plenty of RAM, keep idle container memory in RAM
    #    instead of swapping it out to grow the page cache (default 60).
    #  - fs.inotify.max_user_instances 1024: many containers watch folders
    #    (media servers, *arr apps, document ingest); the default 128 is tight.
    docker_host_sysctls:
      vm.swappiness: 10
      fs.inotify.max_user_instances: 1024
    # Cap the systemd journal (default is 10% of the filesystem, up to 4G).
    docker_journald_max_use: 1G

  pre_tasks:
    - name: Verify target is Ubuntu
      ansible.builtin.assert:
        that: ansible_distribution == "Ubuntu"
        fail_msg: "This playbook only supports Ubuntu (found {{ ansible_distribution }})"

    - name: Detect system architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    # Older runs wrote a one-line docker.list signed by a dearmored docker.gpg.
    # Alongside docker.sources (signed by docker.asc) apt refuses to read any
    # sources at all, so it has to go before the first apt task.
    - name: Remove legacy one-line Docker APT source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

  tasks:
    - name: Ensure required system packages are present
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-debian
          # Stacks mount NAS shares as "local" volumes with type: cifs; without
          # mount.cifs, docker fails to start them with "no such device".
          - cifs-utils
        state: present
        update_cache: yes

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the machine if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible due to package upgrade."
        pre_reboot_delay: 60
        reboot_timeout: 600
        post_reboot_delay: 60
      when: reboot_required.stat.exists and allow_reboot | bool

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "{{ docker_gpg_url }}"
        dest: "{{ docker_gpg_armored_path }}"
        mode: '0644'
        force: false

    # deb822 format, matching Docker's install docs; apt reads the armored key directly.
    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ dpkg_arch.stdout }}"
        signed_by: "{{ docker_gpg_armored_path }}"
        state: present
      register: docker_apt_repo

    # deb822_repository does not refresh the cache itself, so force it when the repo changed.
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: "{{ 0 if docker_apt_repo is changed else 3600 }}"

    - name: Install Docker Engine and related packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
      notify:
        - Start Docker service
        - Restart containers holding a stale Docker socket

    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'
      tags: [daemon]

    - name: Read existing daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_existing
      failed_when: false
      tags: [daemon]

    - name: Write daemon.json (existing keys merged with docker_daemon_options)
      ansible.builtin.copy:
        content: >-
          {{ ((docker_daemon_existing.content | b64decode | from_json)
              if docker_daemon_existing.content is defined else {})
             | combine(docker_daemon_options, recursive=true)
             | to_nice_json(indent=4) }}
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        validate: dockerd --validate --config-file %s
      notify:
        - Restart Docker service
        - Restart containers holding a stale Docker socket
      tags: [daemon]

    - name: Write host sysctl tuning
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (ansible/docker/install_docker.yml, docker_host_sysctls)
          {% for key, value in docker_host_sysctls.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
        dest: /etc/sysctl.d/90-homelab-docker.conf
        owner: root
        group: root
        mode: '0644'
      notify: Apply sysctl settings
      tags: [host-tuning]

    - name: Ensure journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'
      tags: [host-tuning]

    - name: Cap journald disk usage
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (ansible/docker/install_docker.yml, docker_journald_max_use)
          [Journal]
          SystemMaxUse={{ docker_journald_max_use }}
        dest: /etc/systemd/journald.conf.d/90-size.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart journald
      tags: [host-tuning]

  handlers:
    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # Restarts every container once (live-restore only protects restarts after
    # it is already active). Containers with a restart policy come back.
    - name: Restart Docker service
      ansible.builtin.service:
        name: docker
        state: restarted
        enabled: true

    # With live-restore, containers survive a dockerd upgrade or restart, but
    # dockerd recreates /var/run/docker.sock. Containers that bind-mount the
    # socket file (Portainer agent, Traefik, socket proxies) keep the old,
    # dead inode until restarted. Restart only those whose socket no longer
    # matches the host's. Must stay after "Restart Docker service".
    - name: Restart containers holding a stale Docker socket
      ansible.builtin.shell: |
        {% raw %}
        set -euo pipefail
        host_inode=$(stat -L -c %i /var/run/docker.sock)
        for id in $(docker ps -q); do
          pid=$(docker inspect -f '{{.State.Pid}}' "$id")
          docker inspect -f '{{range .Mounts}}{{.Source}} {{.Destination}}{{println}}{{end}}' "$id" |
            awk '$1 ~ /(^|\/)docker\.sock$/ { print $2 }' |
            while read -r dest; do
              if [ "$(stat -L -c %i "/proc/$pid/root$dest" 2>/dev/null)" != "$host_inode" ]; then
                docker restart "$id" >/dev/null
                docker inspect -f '{{.Name}}' "$id"
                break
              fi
            done
        done
        {% endraw %}
      args:
        executable: /bin/bash
      register: stale_socket_restart
      changed_when: stale_socket_restart.stdout | length > 0

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-homelab-docker.conf

    # Restarting journald does not affect containers or other services.
    - name: Restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted
