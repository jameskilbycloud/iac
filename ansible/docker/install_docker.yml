---
- name: Install Docker on supported Ubuntu hosts
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    docker_gpg_path: /etc/apt/keyrings/docker.gpg
    docker_gpg_url: https://download.docker.com/linux/ubuntu/gpg
    docker_gpg_armored_path: /etc/apt/keyrings/docker.asc
    allow_reboot: false
    # Daemon-wide defaults merged into /etc/docker/daemon.json. Keys already in
    # the file that are not listed here (e.g. the "nvidia" runtime written by
    # nvidia-ctk in ../vGPU) are preserved; keys listed here win.
    #  - log-opts: every container gets capped json-file logs, including ones
    #    started outside compose (docker run, Portainer agent, DockFlare's
    #    cloudflared) that never set their own logging block. Only applies to
    #    containers created after the change.
    #  - live-restore: containers keep running while dockerd restarts or is
    #    upgraded. Enabling it needs one daemon restart, which does restart them.
    docker_daemon_options:
      log-driver: json-file
      log-opts:
        max-size: "10m"
        max-file: "3"
      live-restore: true

  pre_tasks:
    - name: Verify target is Ubuntu
      ansible.builtin.assert:
        that: ansible_distribution == "Ubuntu"
        fail_msg: "This playbook only supports Ubuntu (found {{ ansible_distribution }})"

    - name: Detect system architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Set Docker repository URL
      ansible.builtin.set_fact:
        docker_repo: "deb [arch={{ dpkg_arch.stdout }} signed-by={{ docker_gpg_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

  tasks:
    - name: Ensure required system packages are present
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the machine if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible due to package upgrade."
        pre_reboot_delay: 60
        reboot_timeout: 600
        post_reboot_delay: 60
      when: reboot_required.stat.exists and allow_reboot | bool

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "{{ docker_gpg_url }}"
        dest: "{{ docker_gpg_armored_path }}"
        mode: '0644'
        force: false

    - name: Dearmor Docker GPG key
      ansible.builtin.command: gpg --dearmor -o {{ docker_gpg_path }} {{ docker_gpg_armored_path }}
      args:
        creates: "{{ docker_gpg_path }}"

    - name: Set permissions on Docker GPG key
      ansible.builtin.file:
        path: "{{ docker_gpg_path }}"
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "{{ docker_repo }}"
        filename: docker
        state: present

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker Engine and related packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
      notify: Start Docker service

    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'
      tags: [daemon]

    - name: Read existing daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_existing
      failed_when: false
      tags: [daemon]

    - name: Write daemon.json (existing keys merged with docker_daemon_options)
      ansible.builtin.copy:
        content: >-
          {{ ((docker_daemon_existing.content | b64decode | from_json)
              if docker_daemon_existing.content is defined else {})
             | combine(docker_daemon_options, recursive=true)
             | to_nice_json(indent=4) }}
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        validate: dockerd --validate --config-file %s
      notify: Restart Docker service
      tags: [daemon]

  handlers:
    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # Restarts every container once (live-restore only protects restarts after
    # it is already active). Containers with a restart policy come back.
    - name: Restart Docker service
      ansible.builtin.service:
        name: docker
        state: restarted
        enabled: true
